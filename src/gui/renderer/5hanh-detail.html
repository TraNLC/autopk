<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Xây Dựng Ngũ Hành</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; color: #333; }
    h2 { margin-top: 0; color: #2c3e50; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .select-group { display: flex; align-items: center; gap: 10px; }
    select { padding: 8px 15px; border-radius: 4px; border: 1px solid #ddd; outline: none; font-size: 14px; font-weight: bold; }
    
    .layout-container { display: flex; gap: 20px; align-items: flex-start; }
    .image-container { flex: 0 0 350px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
    .image-container img { max-width: 100%; border-radius: 5px; }
    
    .items-container { flex: 1; display: flex; flex-direction: column; gap: 15px; }
    .group-panel { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #bdc3c7; }
    .group-title { font-weight: bold; font-size: 16px; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; max-height: 200px; overflow-y: auto; padding-right: 5px; }
    
    /* Scrollbar */
    .items-grid::-webkit-scrollbar { width: 6px; }
    .items-grid::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
    .items-grid::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
    
    .item-card { border: 1px solid #eee; border-radius: 5px; padding: 10px; background: #fafafa; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
    .item-header { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
    .item-prop { display: flex; justify-content: space-between; }
    .lbl { color: #7f8c8d; }
    
    .magics { margin-top: 5px; padding-top: 5px; border-top: 1px dashed #ddd; font-size: 12px; }
    .magic-item { padding: 1px 0; }
    
    .buy-btn { margin-top: auto; padding: 5px 10px; background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 12px; align-self: flex-end; }
    .buy-btn:hover { background: #c0392b; }
    .buy-btn:disabled { background: #95a5a6; cursor: not-allowed; }
    
    .empty-msg { color: #999; font-style: italic; padding: 10px; text-align: center; grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>
      <h2>Xây Dựng Đồ Ngũ Hành</h2>
      <div style="font-size: 13px; color: #7f8c8d;">Chọn hệ Vũ Khí làm chuẩn để hệ thống tự động lọc 4 bộ trang bị còn lại.</div>
    </div>
    <div class="select-group">
      <label>Hệ Vũ Khí muốn Build:</label>
      <select id="sel-core-series">
        <option value="0">🟡 Kim</option>
        <option value="1">🟢 Mộc</option>
        <option value="2">🔵 Thủy</option>
        <option value="3">🔴 Hỏa</option>
        <option value="4">🟤 Thổ</option>
      </select>
    </div>
  </div>
  
  <div class="layout-container">
    <div class="image-container">
      <div style="font-weight: bold; margin-bottom: 10px; font-size: 16px;">Sơ Đồ Kích Hoạt</div>
      <img id="img-5hanh" src="../../../frida-scripts/core/5hanh_img/5hanh_kim.png" alt="Ngũ Hành" />
      <div style="margin-top: 15px; font-size: 13px; color: #555; text-align: left;">
        <div style="margin-bottom: 5px;"><b>Nguyên lý kích hoạt:</b></div>
        <div>• <b>Kim</b> kích <b>Thủy</b></div>
        <div>• <b>Thủy</b> kích <b>Mộc</b></div>
        <div>• <b>Mộc</b> kích <b>Hỏa</b></div>
        <div>• <b>Hỏa</b> kích <b>Thổ</b></div>
        <div>• <b>Thổ</b> kích <b>Kim</b></div>
      </div>
    </div>
    
    <div class="items-container" id="groups-container">
      <!-- 5 groups will be injected here -->
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    let allItems = [];
    let currentDevId = null;
    
    // Mapping 5 elements rules
    // Series IDs: 1:Kim, 2:Mộc, 3:Thủy, 4:Hỏa, 5:Thổ
    // Activation chain: Thổ(5) -> Kim(1) -> Thủy(3) -> Mộc(2) -> Hỏa(4) -> Thổ(5)
    
    const SERIES_NAMES = { 0: 'Kim', 1: 'Mộc', 2: 'Thủy', 3: 'Hỏa', 4: 'Thổ' };
    const SERIES_COLORS = { 0: '#d4af37', 1: '#27ae60', 2: '#3498db', 3: '#e74c3c', 4: '#f39c12' };
    
    const PAIR_NAMES = {
      p1: 'Vũ Khí & Mũ',
      p2: 'Giày & Nhẫn (trên)',
      p3: 'Bao Tay & Ngọc Bội',
      p4: 'Thắt Lưng & Nhẫn (dưới)',
      p5: 'Áo & Dây Chuyền'
    };
    
    // Genre mapping:
    // Vũ Khí: 0, 1 (Ám Khí)
    // Áo: 2
    // Nhẫn: 3
    // Dây Chuyền: 4
    // Giày: 5
    // Thắt Lưng: 6
    // Mũ: 7
    // Bao Tay: 8
    // Ngọc Bội: 9
    
    function formatMoney(amount) {
      if (amount >= 10000) return (amount / 10000) + ' vạn';
      return amount + ' lượng';
    }
    
    function renderGroups(coreSeries) {
      coreSeries = parseInt(coreSeries);
      
      // Calculate required series for each pair
      // Vũ khí + Mũ = coreSeries
      const s1 = coreSeries;
      // Vũ khí(s1) kích Giày + Nhẫn Trên(s2) -> s1 kích s2
      // Kim(1)->Thủy(3), Mộc(2)->Hỏa(4), Thủy(3)->Mộc(2), Hỏa(4)->Thổ(5), Thổ(5)->Kim(1)
      const activationMap = { 0: 2, 2: 1, 1: 3, 3: 4, 4: 0 };
      
      const s2 = activationMap[s1];
      const s3 = activationMap[s2];
      const s4 = activationMap[s3];
      const s5 = activationMap[s4]; // Áo & Dây chuyền
      
      // Update image
      const imgNameMap = { 1: 'kim', 2: 'moc', 3: 'thuy', 4: 'hoa', 5: 'tho' };
      document.getElementById('img-5hanh').src = `../../../frida-scripts/core/5hanh_img/5hanh_${imgNameMap[s1]}.png`;
      
      const groupsConfig = [
        { id: 'p1', title: PAIR_NAMES.p1, series: s1, genres: [0, 1, 7], color: SERIES_COLORS[s1] },
        { id: 'p2', title: PAIR_NAMES.p2, series: s2, genres: [5, 3], color: SERIES_COLORS[s2] },
        { id: 'p3', title: PAIR_NAMES.p3, series: s3, genres: [8, 9], color: SERIES_COLORS[s3] },
        { id: 'p4', title: PAIR_NAMES.p4, series: s4, genres: [6, 3], color: SERIES_COLORS[s4] },
        { id: 'p5', title: PAIR_NAMES.p5, series: s5, genres: [2, 4], color: SERIES_COLORS[s5] }
      ];
      
      const container = document.getElementById('groups-container');
      container.innerHTML = '';
      
      // Filter out consumables
      const equippableItems = allItems.filter(it => it.genre !== 10006);
      
      groupsConfig.forEach(grp => {
        // Find items that match genre and series
        const matchedItems = equippableItems.filter(it => it.series === grp.series && grp.genres.includes(it.genre));
        
        // Sort by level descending (highest level first)
        matchedItems.sort((a, b) => (b.level || 0) - (a.level || 0));
        
        let itemsHtml = '';
        if (matchedItems.length === 0) {
          itemsHtml = `<div class="empty-msg">Chưa có trang bị nào thuộc nhóm này đang được bày bán.</div>`;
        } else {
          itemsHtml = matchedItems.map(item => {
            const genderStr = item.gender === 0 ? 'Nam' : (item.gender === 1 ? 'Nữ' : 'Không Y/C');
            
            let magicsHtml = '<div style="color: #999; font-style: italic;">Không có thuộc tính ẩn</div>';
            if (item.magics && item.magics.length > 0) {
              magicsHtml = item.magics.map((m, idx) => {
                const color = idx % 2 === 0 ? '#0984e3' : '#636e72';
                return `<div class="magic-item" style="color: ${color}; font-weight: 500;">• ${m}</div>`;
              }).join('');
            }
            
            return `
              <div class="item-card">
                <div class="item-header" style="color: black;">
                  ${item.realName || item.name} <span style="color: ${grp.color}; font-size: 13px; font-weight: normal;">(Hệ ${SERIES_NAMES[grp.series]})</span>
                </div>
                <div class="item-prop"><span class="lbl" style="color: black;">Sạp:</span> <b style="color: #8e44ad;">${item.shopName}</b></div>
                <div class="item-prop"><span class="lbl" style="color: black;">Cấp:</span> <span style="color: black;">${item.level || 0}</span></div>
                ${ item.reqStr > 0 ? `<div class="item-prop"><span class="lbl" style="color: black;">Yêu cầu sức mạnh:</span> <span style="color: black;">${item.reqStr} điểm</span></div>` : '' }
                ${ item.reqDex > 0 ? `<div class="item-prop"><span class="lbl" style="color: black;">Yêu cầu thân pháp:</span> <span style="color: black;">${item.reqDex} điểm</span></div>` : '' }
                <div class="item-prop"><span class="lbl" style="color: black;">Giới Tính:</span> <span style="color: black;">${genderStr}</span></div>
                <div class="item-prop"><span class="lbl" style="color: black;">Giá bán:</span> <b style="color: #d35400;">${formatMoney(item.money)}</b> | <b style="color: #27ae60;">${item.knb || 0} KNB</b></div>
                <div class="magics">
                  ${magicsHtml}
                </div>
                <button class="buy-btn" data-idx="${item.idx}" data-cid="${item.sellerId}">Mua Ngay</button>
              </div>
            `;
          }).join('');
        }
        
        container.innerHTML += `
          <div class="group-panel" style="border-left-color: ${grp.color};">
            <div class="group-title">
              <span>${grp.title}</span>
              <span style="color: ${grp.color};">Hệ ${SERIES_NAMES[grp.series]}</span>
            </div>
            <div class="items-grid">
              ${itemsHtml}
            </div>
          </div>
        `;
      });
      
      // Bind buy buttons
      document.querySelectorAll('.buy-btn').forEach(btn => {
        btn.onclick = async () => {
          btn.disabled = true;
          btn.innerText = '...';
          const idx = parseInt(btn.getAttribute('data-idx'));
          const cid = btn.getAttribute('data-cid');
          
          try {
            const res = await ipcRenderer.invoke('buy-datau', currentDevId, cid, idx);
            if (res && res.ok) {
              btn.innerText = 'Đã Mua';
              btn.style.background = '#27ae60';
            } else {
              btn.innerText = 'Lỗi';
              btn.style.background = '#e74c3c';
              alert('Lỗi: ' + (res ? res.error : 'Unknown'));
            }
          } catch(e) {
            btn.innerText = 'Lỗi';
            alert('Ngoại lệ: ' + e.message);
          }
        };
      });
    }

    document.getElementById('sel-core-series').addEventListener('change', (e) => {
      renderGroups(e.target.value);
    });

    ipcRenderer.on('load-5hanh-data', (event, globalData) => {
      currentDevId = globalData.devId;
      allItems = globalData.items || [];
      // Default to Metal (1)
      renderGroups(0);
    });
  </script>
</body>
</html>
