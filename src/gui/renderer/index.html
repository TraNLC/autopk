<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>GST Auto TK ver 1.0 (17/07/2026 14:20)</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP: DataGridView (Table) -->
  <div class="datagrid-container">
    <table class="datagrid">
      <thead>
        <tr>
          <th width="30">#</th>
          <th width="110">Nhân vật</th>
          <th width="40">Cấp</th>
          <th width="80">Môn phái</th>
          <th width="60">Điểm</th>
          <th>Trạng thái</th>
        </tr>
      </thead>
      <tbody id="device-table-body">
        <tr>
          <td colspan="6" style="text-align: center; color: #888;">Đang làm mới...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- MIDDLE: Main Content -->
  <div class="main-content" style="padding: 10px; display: flex; flex-direction: column; flex: 1; box-sizing: border-box; overflow-y: hidden;">
    
    <div style="flex: 0 0 auto;">
      <!-- Auto Toggle Button -->
      <div style="margin-bottom: 15px;">
        <button id="btn-toggle-auto-tk" class="start-btn"
          style="width: 100%; padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 4px; color: white; background-color: #0066cc; cursor: pointer; transition: background-color 0.2s;">BAT DAU AUTO TONG KIM</button>
        <div style="font-size: 10px; color: #666; margin-top: 6px; text-align: center;">Tick chọn vào ô # ở bảng trên để bật/tắt Auto riêng lẻ từng acc.</div>
      </div>
      
      <div style="display: flex; gap: 15px; margin-bottom: 10px;">
        <!-- Left: Acc Settings -->
        <div class="groupbox" style="flex: 1; margin: 0;">
          <span class="groupbox-title">Cài đặt nhân vật (<strong id="lbl-selected-acc" style="color: blue;">Chưa chọn</strong>)</span>
          <div class="groupbox-content" id="acc-settings-panel">
            <!-- Section 1 -->
            <div style="margin-bottom: 10px;">
              <div style="font-weight: bold; margin-bottom: 5px; color: #0066cc;">1. Chọn phe ra trận</div>
              <div style="display: flex; align-items: center; gap: 15px; margin-left: 10px;">
                <label style="cursor: pointer; font-size: 13px;"><input type="radio" name="rad-side" value="auto" checked> Tự động</label>
                <label style="cursor: pointer; font-size: 13px;"><input type="radio" name="rad-side" value="song"> Tống</label>
                <label style="cursor: pointer; font-size: 13px;"><input type="radio" name="rad-side" value="jin"> Kim</label>
              </div>
            </div>
            
            <!-- Section 2 -->
            <div style="margin-bottom: 5px;">
              <div style="font-weight: bold; margin-bottom: 5px; color: #0066cc;">2. Sử dụng lắc (Hỗ trợ)</div>
              <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px; margin-left: 10px; font-size: 12px;">
                <span style="font-weight: 500;">Chu kỳ:</span>
                <select id="sel-lac-interval" style="padding: 2px; border-radius: 3px; border: 1px solid #ccc; font-size: 12px;">
                  <option value="30">30 giây</option>
                  <option value="60">1 phút</option>
                  <option value="120">2 phút</option>
                  <option value="180">3 phút</option>
                  <option value="240">4 phút</option>
                  <option value="300">5 phút</option>
                </select>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 12px; margin-left: 10px; margin-right: 20px;">
                 <label style="cursor: pointer;"><input type="checkbox" id="chk-lac1" value="45" checked> Phi Tốc <span id="lbl-count-45" style="color: #888; font-size: 11px;">(0)</span></label>
                 <label style="cursor: pointer;"><input type="checkbox" id="chk-lac2" value="51" checked> Lệnh Bài <span id="lbl-count-51" style="color: #888; font-size: 11px;">(0)</span></label>
                 <label style="cursor: pointer;"><input type="checkbox" id="chk-lac3" value="50" checked> Chiến Cổ <span id="lbl-count-50" style="color: #888; font-size: 11px;">(0)</span></label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Logs -->
    <div style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
      <div style="font-weight: bold; margin-bottom: 5px; color: #0066cc;" id="lbl-log-title">Nhật ký hoạt động: Hệ thống</div>
      <div class="log-container" id="global-log-container" style="flex: 1; min-height: 80px; border-radius: 4px; padding: 8px; box-sizing: border-box; overflow-y: auto;"></div>
    </div>

  </div>

  <!-- BOTTOM: StatusBar -->
  <div class="status-bar">
    <div class="bottom-left" style="color: #666; font-weight: bold; padding-left: 5px;">
      ✅ GST Auto PK
    </div>
    <div class="bottom-right">
      <button id="btn-refresh" class="icon-btn" title="Làm mới thiết bị">🔄</button>
      <button id="btn-restart" class="icon-btn" title="Cài đặt">⚙</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
